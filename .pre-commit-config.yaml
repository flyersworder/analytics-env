repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.15.7  # Use the latest stable version
    hooks:
      - id: ruff
        args: [--fix, "--line-length=88"]
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/|
            .ipynb_checkpoints/
          )
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        args: [--line-length=88]
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/|
            .ipynb_checkpoints/
          )
  - repo: https://github.com/flyersworder/sqlnbfmt
    rev: v0.4.2
    hooks:
      - id: sqlnbfmt
        name: sqlnbfmt
        types: [jupyter]
        args: [--config, config.yaml]
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/|
            .ipynb_checkpoints/
          )
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
        args: [--line-length=88]
        # Keep in sync with the black hook rev above (nbQA installs it unpinned).
        additional_dependencies: [black==26.3.1]
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/|
            .ipynb_checkpoints/
          )
      - id: nbqa-ruff
        args: [--fix, "--line-length=88"]
        # Keep in sync with the ruff hook rev above; unpinned, nbQA installs
        # the latest ruff and picks up new default rules (e.g. ruff 0.16).
        additional_dependencies: [ruff==0.15.7]
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/|
            .ipynb_checkpoints/
          )
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.0.4
    hooks:
      - id: sqlfluff-fix
        args: ["--dialect", "ansi"]
        files: \.sql$  # Only process .sql files
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/
          )
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/|
            .ipynb_checkpoints/
          )
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/
          )
      - id: trailing-whitespace
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/
          )
      - id: check-added-large-files
        args: ["--maxkb=512"]  # Adjust the max file size as needed
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/
          )
      - id: check-ast
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/
          )
