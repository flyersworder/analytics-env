repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.7  # Use the latest stable version
    hooks:
      - id: ruff
        args: [--fix, "--line-length=88"]
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/|
            .ipynb_checkpoints/
          )
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: [--line-length=88]
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/|
            .ipynb_checkpoints/
          )
  - repo: https://github.com/flyersworder/sqlnbfmt
    rev: v0.4.2
    hooks:
      - id: sqlnbfmt
        name: sqlnbfmt
        types: [jupyter]
        args: [--config, config.yaml]
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/|
            .ipynb_checkpoints/
          )
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
        args: [--line-length=88]
        # Keep in sync with the black hook rev above (nbQA installs it unpinned).
        additional_dependencies: [black==26.5.1]
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/|
            .ipynb_checkpoints/
          )
      # No nbqa-ruff: the ruff hook lints .ipynb natively and is cell-aware
      # (nbQA concatenates cells, causing false B018 on display expressions).
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-fix
        args: ["--dialect", "ansi"]
        files: \.sql$  # Only process .sql files
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/
          )
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/|
            .ipynb_checkpoints/
          )
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/
          )
      - id: trailing-whitespace
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/
          )
      - id: check-added-large-files
        args: ["--maxkb=512"]  # Adjust the max file size as needed
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/
          )
      - id: check-ast
        exclude: |
          (^|/)(
            venv/|
            env/|
            .venv/|
            build/|
            dist/
          )
